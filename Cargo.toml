[workspace]
resolver = "2"
members = [
    "crates/ef-core",
    "crates/ef-db",
    "crates/ef-api",
    "crates/ef-scheduler",
    "crates/ef-orchestrator",
    "crates/ef-control",
    "crates/ef-streaming",
    "crates/ef-agent",
    "crates/ef-cli",
    "crates/ef-ml-worker",
]
# WASM crate — build with `trunk` from crates/ef-dashboard, excluded from default workspace builds.
exclude = ["crates/ef-dashboard"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["EdgeFabric Contributors"]
license = "MIT"
repository = "https://github.com/edgefabric/edgefabric"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web / API
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "util"] }
hyper = { version = "1", features = ["full"] }

# gRPC
tonic = "0.13"
prost = "0.13"
tonic-build = "0.13"
tonic-health = "0.13"
tonic-reflection = "0.13"
tokio-stream = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth / JWT
jsonwebtoken = "9"

# Rate limiting
governor = "0.8"

# OpenAPI
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }

# Redis
redis = { version = "0.27", features = ["tokio-comp"] }

# Messaging
async-nats = "0.38"

# MQTT (IoT)
rumqttc = "0.24"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# WebRTC
webrtc = "0.8"

# Concurrency
dashmap = "6"
futures = "0.3"
bytes = "1"

# Base64
base64 = "0.22"

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config
config = "0.14"

# CLI
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
dirs = "6"

# Observability / Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["http-listener"] }
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["tonic"] }
tracing-opentelemetry = "0.28"

# Internal crates
ef-core = { path = "crates/ef-core" }
ef-db = { path = "crates/ef-db" }
ef-api = { path = "crates/ef-api" }
ef-scheduler = { path = "crates/ef-scheduler" }
ef-orchestrator = { path = "crates/ef-orchestrator" }
ef-control = { path = "crates/ef-control" }
ef-streaming = { path = "crates/ef-streaming" }
ef-agent = { path = "crates/ef-agent" }
ef-cli = { path = "crates/ef-cli" }
ef-ml-worker = { path = "crates/ef-ml-worker" }
