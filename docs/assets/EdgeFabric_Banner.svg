<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1b3e"/>
      <stop offset="50%" style="stop-color:#1a3a6b"/>
      <stop offset="100%" style="stop-color:#0d1b3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2e7de6"/>
      <stop offset="100%" style="stop-color:#4fc3f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" rx="12" fill="url(#bg)"/>

  <!-- Subtle top/bottom accent lines -->
  <rect x="0" y="0" width="1200" height="3" rx="2" fill="url(#accent)" opacity="0.6"/>
  <rect x="0" y="217" width="1200" height="3" rx="2" fill="url(#accent)" opacity="0.3"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="3">EDGEFABRIC — END-TO-END ARCHITECTURE</text>

  <!-- ── Layer boxes ── -->
  <!-- Users / CI -->
  <rect x="30" y="62" width="160" height="100" rx="10" fill="#1a3158" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="90" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#7eb8ff">USERS &amp; CI</text>
  <text x="110" y="112" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">Developers</text>
  <text x="110" y="128" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">QA Teams</text>
  <text x="110" y="144" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">CI/CD Pipelines</text>

  <!-- Arrow 1 -->
  <line x1="195" y1="112" x2="245" y2="112" stroke="#4fc3f7" stroke-width="2" filter="url(#glow)"/>
  <polygon points="245,106 258,112 245,118" fill="#4fc3f7"/>

  <!-- API Gateway -->
  <rect x="262" y="62" width="160" height="100" rx="10" fill="#1a3158" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="342" y="90" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#7eb8ff">API GATEWAY</text>
  <text x="342" y="112" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">REST + gRPC</text>
  <text x="342" y="128" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">Auth (OAuth/JWT)</text>
  <text x="342" y="144" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">TLS 1.3</text>

  <!-- Arrow 2 -->
  <line x1="427" y1="112" x2="477" y2="112" stroke="#4fc3f7" stroke-width="2" filter="url(#glow)"/>
  <polygon points="477,106 490,112 477,118" fill="#4fc3f7"/>

  <!-- Orchestration -->
  <rect x="494" y="62" width="160" height="100" rx="10" fill="#1a3158" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="574" y="90" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#7eb8ff">ORCHESTRATION</text>
  <text x="574" y="112" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">Scheduler</text>
  <text x="574" y="128" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">Test Orchestrator</text>
  <text x="574" y="144" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">Live Sessions</text>

  <!-- Arrow 3 -->
  <line x1="659" y1="112" x2="709" y2="112" stroke="#4fc3f7" stroke-width="2" filter="url(#glow)"/>
  <polygon points="709,106 722,112 709,118" fill="#4fc3f7"/>

  <!-- Control Plane -->
  <rect x="726" y="62" width="175" height="100" rx="10" fill="#162d50" stroke="#2e7de6" stroke-width="2"/>
  <text x="813" y="90" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#60a5fa">CONTROL PLANE</text>
  <text x="813" y="108" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">Device Manager</text>
  <text x="813" y="124" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">Command Engine</text>
  <text x="813" y="140" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">Streaming (WebRTC)</text>
  <text x="813" y="156" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#4fc3f7">Rust Core</text>

  <!-- Arrow 4 -->
  <line x1="906" y1="112" x2="956" y2="112" stroke="#4fc3f7" stroke-width="2" filter="url(#glow)"/>
  <polygon points="956,106 969,112 956,118" fill="#4fc3f7"/>

  <!-- Devices -->
  <rect x="973" y="62" width="195" height="100" rx="10" fill="#1a3158" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="1070" y="90" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#7eb8ff">DEVICES</text>
  <text x="1070" y="112" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">Android (Real / Emul)</text>
  <text x="1070" y="128" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">iOS (Real / Sim)</text>
  <text x="1070" y="144" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#94a3b8">IoT / Digital Twins</text>

  <!-- Bottom: Data Layer -->
  <rect x="262" y="178" width="639" height="32" rx="8" fill="#0f1e38" stroke="#1e3a5f" stroke-width="1"/>
  <text x="581" y="199" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b">PostgreSQL  ·  Redis  ·  NATS JetStream  ·  CoTURN</text>

  <!-- Vertical connectors from middle boxes to data layer -->
  <line x1="342" y1="162" x2="342" y2="178" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="574" y1="162" x2="574" y2="178" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="813" y1="162" x2="813" y2="178" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
