apiVersion: v1
kind: Service
metadata:
  name: {{ include "edgefabric.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edgefabric.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "edgefabric.apiSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
