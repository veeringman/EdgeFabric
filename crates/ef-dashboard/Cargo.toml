[package]
name = "ef-dashboard"
version = "0.1.0"
edition = "2021"
authors = ["EdgeFabric Contributors"]
license = "MIT"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
leptos_router = { version = "0.7" }
leptos_meta = { version = "0.7" }

# HTTP client (WASM-compatible)
gloo-net = { version = "0.6", features = ["json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-storage = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

# UUID
uuid = { version = "1", features = ["v4", "serde", "js"] }

# Logging
web-sys = { version = "0.3", features = [
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlImageElement",
    "Window",
    "Document",
    "Element",
    "console",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "MediaStream",
    "RtcPeerConnection",
    "RtcPeerConnectionIceEvent",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcSdpType",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcConfiguration",
    "RtcDataChannel",
    "RtcDataChannelEvent",
    "RtcTrackEvent",
    "HtmlVideoElement",
    "WebSocket",
    "BinaryType",
    "MessageEvent",
    "Event",
    "CloseEvent",
    "KeyboardEvent",
    "MouseEvent",
    "Location",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
