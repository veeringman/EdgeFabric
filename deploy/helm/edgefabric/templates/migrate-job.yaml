apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "edgefabric.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edgefabric.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "edgefabric.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "edgefabric.serviceAccountName" . }}
      containers:
        - name: migrate
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          command: ["sqlx", "migrate", "run", "--source", "/app/migrations"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "edgefabric.fullname" . }}-secrets
                  key: EF__DATABASE__URL
