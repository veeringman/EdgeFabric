apiVersion: apps/v1
kind: Deployment
metadata:
  name: ef-api
  namespace: edgefabric
  labels:
    app.kubernetes.io/name: ef-api
    app.kubernetes.io/part-of: edgefabric
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ef-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ef-api
        app.kubernetes.io/part-of: edgefabric
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: edgefabric
      containers:
        - name: ef-api
          image: ghcr.io/edgefabric/ef-api:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 50051
              name: grpc
              protocol: TCP
          envFrom:
            - configMapRef:
                name: edgefabric-config
            - secretRef:
                name: edgefabric-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 5
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ef-api
  namespace: edgefabric
  labels:
    app.kubernetes.io/name: ef-api
    app.kubernetes.io/part-of: edgefabric
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
  selector:
    app.kubernetes.io/name: ef-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ef-api
  namespace: edgefabric
  labels:
    app.kubernetes.io/name: ef-api
    app.kubernetes.io/part-of: edgefabric
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.edgefabric.io
      secretName: ef-api-tls
  rules:
    - host: api.edgefabric.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ef-api
                port:
                  name: http
