syntax = "proto3";

package edgefabric.test.v1;

service TestService {
  rpc RunTest (RunTestRequest) returns (RunTestResponse);
  rpc GetJobStatus (JobStatusRequest) returns (JobStatus);
  rpc CancelJob (CancelJobRequest) returns (CancelJobResponse);
  rpc StreamResults (JobStatusRequest) returns (stream TestResult);
}

message RunTestRequest {
  bytes app_binary = 1;
  bytes test_suite = 2;
  optional string os = 3;
  optional string version = 4;
  int32 parallelism = 5;
  int32 timeout_minutes = 6;
}

message RunTestResponse {
  string job_id = 1;
  string status = 2;
  int32 devices_allocated = 3;
}

message JobStatusRequest {
  string job_id = 1;
}

message JobStatus {
  string job_id = 1;
  string status = 2;
  int32 total_tests = 3;
  int32 passed = 4;
  int32 failed = 5;
  int32 running = 6;
  int32 pending = 7;
}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobResponse {
  bool success = 1;
}

message TestResult {
  string test_name = 1;
  string device_id = 2;
  string status = 3;  // "passed", "failed", "skipped", "error"
  int64 duration_ms = 4;
  string error_message = 5;
}
