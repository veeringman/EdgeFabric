name: package-extension

on:
  workflow_dispatch:
  push:
    tags:
      - "edgefabric-extension-v*"

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/edgefabric-vscode-extension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npm run package:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgefabric-vsix
          path: tools/edgefabric-vscode-extension/*.vsix
