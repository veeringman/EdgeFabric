apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edgefabric.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edgefabric.labels" . | nindent 4 }}
type: Opaque
stringData:
  EF__DATABASE__URL: {{ .Values.database.url | quote }}
  EF__AUTH__JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
  EF__STREAMING__TURN_PASSWORD: {{ .Values.streaming.turnPassword | quote }}
